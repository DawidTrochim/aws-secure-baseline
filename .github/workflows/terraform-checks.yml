# Runs on every pull request to main.
# Only static checks here - nothing talks to AWS and there are no AWS credentials in CI.
name: terraform-checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

      - name: Set up tflint
        uses: terraform-linters/setup-tflint@v6

      - name: tflint
        run: |
          tflint --init
          tflint --format compact
        env:
          # stops tflint --init hitting GitHub API rate limits when it downloads the aws plugin
          GITHUB_TOKEN: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: checkov
        run: |
          pip install checkov
          checkov --directory . --framework terraform github_actions --compact --quiet
